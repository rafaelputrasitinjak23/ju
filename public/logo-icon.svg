<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="60%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Chrome Metal Text Gradient -->
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e4e4e7"/>
      <stop offset="45%" stop-color="#71717a"/>
      <stop offset="55%" stop-color="#27272a"/>
      <stop offset="80%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <!-- Ring Metallic Gradient -->
    <linearGradient id="ringChrome" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="30%" stop-color="#e4e4e7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="chromeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#27272a" stroke-width="3" opacity="0.8"/>
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="#09090b" stroke-width="4"/>

  <g filter="url(#dropShadow)">
    <!-- Outer Metallic Circular Slash Ring -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringChrome)" stroke-width="20" stroke-dasharray="210 25 120 30 180 25" stroke-linecap="butt" transform="rotate(-35 256 256)" filter="url(#chromeGlow)"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#09090b" stroke-width="6"/>

    <!-- Sharp Diagonal Lightning Slash -->
    <polygon points="105,405 410,105 375,90 80,380" fill="url(#metalChrome)" opacity="0.95" filter="url(#chromeGlow)"/>

    <!-- Stylized Metallic RXD Monogram Text -->
    <!-- R -->
    <path d="M 120 310 L 120 200 L 175 200 C 205 200, 215 215, 215 232 C 215 248, 200 260, 180 262 L 220 310 L 185 310 L 152 265 L 148 265 L 148 310 Z M 148 242 L 172 242 C 185 242, 190 238, 190 232 C 190 225, 182 222, 170 222 L 148 222 Z" 
          fill="url(#metalChrome)" stroke="#09090b" stroke-width="4" stroke-linejoin="miter"/>
    
    <!-- X (Centerpiece with sharp slashes) -->
    <path d="M 215 310 L 260 250 L 220 190 L 250 190 L 280 235 L 310 190 L 340 190 L 300 250 L 345 310 L 315 310 L 280 262 L 245 310 Z" 
          fill="url(#metalChrome)" stroke="#09090b" stroke-width="4" stroke-linejoin="miter"/>

    <!-- D -->
    <path d="M 340 310 L 340 200 L 385 200 C 420 200, 440 222, 440 255 C 440 288, 420 310, 385 310 Z M 368 288 L 385 288 C 405 288, 415 276, 415 255 C 415 234, 405 222, 385 222 L 368 222 Z" 
          fill="url(#metalChrome)" stroke="#09090b" stroke-width="4" stroke-linejoin="miter"/>
  </g>
</svg>
